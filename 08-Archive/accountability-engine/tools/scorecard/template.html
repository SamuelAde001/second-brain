<title>Reckoning Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">


<style>
  :root {
    --ground:   #EFF1EE;
    --surface:  #FFFFFF;
    --ink:      #141817;
    --muted:    #5B6461;
    --faint:    #8A9390;
    --rule:     #D6DBD6;
    --band:     #1E3A33;
    --band-ink: #E9EFEA;
    --pass:     #1B6B41;
    --pass-bg:  #E4F0E8;
    --miss:     #A32E1B;
    --miss-bg:  #F8E5E1;
    --warn:     #8A5D0B;
    --warn-bg:  #F8EEDA;
    --null:     #6B7370;
    --null-bg:  #E7EAE7;

    --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --f-body:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --f-data:    'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #0E1211;
      --surface:  #171C1A;
      --ink:      #E8EDEA;
      --muted:    #9AA5A1;
      --faint:    #6C7773;
      --rule:     #2A312E;
      --band:     #0A1512;
      --band-ink: #DCE7E0;
      --pass:     #5FC088;
      --pass-bg:  #14261C;
      --miss:     #F0836C;
      --miss-bg:  #2C1712;
      --warn:     #E0A93F;
      --warn-bg:  #2A2010;
      --null:     #8C9793;
      --null-bg:  #1E2422;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0E1211;
    --surface:  #171C1A;
    --ink:      #E8EDEA;
    --muted:    #9AA5A1;
    --faint:    #6C7773;
    --rule:     #2A312E;
    --band:     #0A1512;
    --band-ink: #DCE7E0;
    --pass:     #5FC088;
    --pass-bg:  #14261C;
    --miss:     #F0836C;
    --miss-bg:  #2C1712;
    --warn:     #E0A93F;
    --warn-bg:  #2A2010;
    --null:     #8C9793;
    --null-bg:  #1E2422;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    line-height: 1.45;
    margin: 0;
    padding: 20px 14px 40px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }

  /* ---- header band ---- */
  .band {
    background: var(--band);
    color: var(--band-ink);
    padding: 14px 18px 15px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
  }
  .band .mark {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .band .date {
    font-family: var(--f-data);
    font-size: 12px;
    letter-spacing: .04em;
    opacity: .8;
    margin-left: auto;
  }
  .band .sub {
    flex-basis: 100%;
    font-size: 11.5px;
    letter-spacing: .05em;
    text-transform: uppercase;
    opacity: .62;
    font-family: var(--f-data);
  }

  /* ---- verdict ---- */
  .verdict {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .score {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 60px;
    line-height: .84;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    color: var(--pass);
  }
  .score small { font-size: 26px; letter-spacing: -.01em; }
  .verdict-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .stamp {
    display: inline-block;
    align-self: flex-start;
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
  }
  .stamp.open { color: var(--warn); background: var(--warn-bg); }
  .stamp.won  { color: var(--pass); background: var(--pass-bg); }
  .stamp.lost { color: var(--miss); background: var(--miss-bg); }
  .ratio {
    font-family: var(--f-data);
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---- sections ---- */
  section { border-bottom: 1px solid var(--rule); }
  section:last-of-type { border-bottom: 0; }

  h2 {
    font-family: var(--f-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0;
    padding: 14px 18px 8px;
  }

  .rows { display: flex; flex-direction: column; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 18px 9px 14px;
    border-left: 4px solid transparent;
  }
  .row + .row { border-top: 1px solid var(--rule); }
  .row.is-pass { border-left-color: var(--pass); }
  .row.is-miss { border-left-color: var(--miss); }
  .row.is-part { border-left-color: var(--warn); }
  .row.is-null { border-left-color: var(--null); }

  .row .what { flex: 1; min-width: 0; }
  .row .what b { font-weight: 600; font-size: 14px; display: block; }
  .row .what span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--f-data);
    margin-top: 2px;
  }

  .tag {
    flex-shrink: 0;
    font-family: var(--f-display);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    margin-top: 2px;
    white-space: nowrap;
  }
  .t-pass { color: var(--pass); background: var(--pass-bg); }
  .t-miss { color: var(--miss); background: var(--miss-bg); }
  .t-part { color: var(--warn); background: var(--warn-bg); }
  .t-null { color: var(--null); background: var(--null-bg); }

  /* ---- habits ---- */
  .habits {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 18px 16px;
  }
  .habit {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 5px 9px;
    border-radius: 2px;
    background: var(--null-bg);
    color: var(--null);
    border: 1px solid transparent;
  }
  .habit .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .habit.h-pass { background: var(--pass-bg); color: var(--pass); }
  .habit.h-miss { background: var(--miss-bg); color: var(--miss); }

  /* ---- metric grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--rule);
    border-top: 1px solid var(--rule);
  }
  .cell { background: var(--surface); padding: 12px 18px 13px; }
  .cell .k {
    font-family: var(--f-data);
    font-size: 10.5px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .cell .v {
    font-family: var(--f-data);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 3px;
    letter-spacing: -.01em;
  }
  .cell .n { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .v.bad { color: var(--miss); }
  .v.ok  { color: var(--pass); }
  .v.nil { color: var(--null); }

  /* ---- footer ---- */
  .foot {
    background: var(--band);
    color: var(--band-ink);
    padding: 15px 18px 16px;
  }
  .foot .rule-quote {
    font-size: 13px;
    line-height: 1.5;
    margin: 0 0 10px;
  }
  .foot .rule-quote em { opacity: .72; font-style: normal; }
  .foot .send {
    font-family: var(--f-display);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    padding-top: 11px;
    border-top: 1px solid rgba(255,255,255,.16);
  }

  .note {
    max-width: 560px;
    margin: 12px auto 0;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--f-data);
    line-height: 1.5;
  }
  .habit.h-null { background: var(--null-bg); color: var(--null); }
  .v.warn { color: var(--warn); }
</style>

<!--__BODY__-->
