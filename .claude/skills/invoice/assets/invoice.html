<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    width: 210mm; height: 296mm; overflow: hidden; padding: 16mm 16mm 14mm;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5pt; line-height: 1.45; color: #111;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .green { color: #2b7a1b; }
  h2 { font-size: 11pt; font-weight: 800; color: #2b7a1b; margin-bottom: 1.5mm; }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: flex-end;
         padding-bottom: 4mm; border-bottom: 4px solid #111; }
  .brand { font-size: 21pt; font-weight: 800; letter-spacing: .03em; line-height: 1; }
  .doc { text-align: right; }
  .doc-title { font-size: 34pt; font-weight: 800; line-height: 1; }
  .doc table { margin: 3mm 0 0 auto; border-collapse: collapse; }
  .doc td { padding: .3mm 0 .3mm 5mm; font-size: 11pt; }
  .doc td:first-child { color: #555; }
  .doc td:last-child { font-weight: 700; text-align: right; }

  /* Parties */
  .parties { display: flex; gap: 10mm; margin-top: 7mm; }
  .parties > div { flex: 1; }

  /* Items */
  .items { width: 100%; border-collapse: collapse; margin-top: 8mm; }
  .items th { background: #2b7a1b; color: #fff; font-weight: 700; text-align: left; padding: 2.6mm 3mm; }
  .items td { padding: 3mm; border-bottom: 1px solid #d9d9d9; font-weight: 600; }
  .items th.amt, .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; width: 27mm; }
  .items tr.total td { font-weight: 800; border-top: 3px solid #111; border-bottom: none; }
  .items tr.extra td { border-bottom: none; padding-top: 1mm; font-weight: 700; }

  .due { margin-top: 4mm; background: #1f5c13; color: #fff; display: flex; justify-content: space-between;
         align-items: center; padding: 4mm 5mm; }
  .due .lbl { font-size: 14pt; font-weight: 800; }
  .due .val { font-size: 22pt; font-weight: 800; }

  /* Payment */
  .pay { margin-top: 8mm; }
  .pay table { border-collapse: collapse; }
  .pay td { padding: .6mm 8mm .6mm 0; }
  .pay td:first-child { color: #555; }
  .pay td:last-child { font-weight: 700; }
  .pay p { margin-top: 3mm; font-weight: 700; color: #b3261e; }
</style>
</head>
<body>

<div class="top">
  <div class="brand">{{BRAND_A}}<span class="green">{{BRAND_B}}</span></div>
  <div class="doc">
    <div class="doc-title">INVOICE</div>
    <table>
      <tr><td>Invoice No.</td><td>{{NUMBER}}</td></tr>
      <tr><td>Issue date</td><td>{{ISSUED}}</td></tr>
      <tr><td>Due</td><td>{{DUE}}</td></tr>
    </table>
  </div>
</div>

<div class="parties">
  <div><h2>FROM</h2><p>{{FROM}}</p></div>
  <div><h2>BILL TO</h2><p>{{BILL_TO}}</p></div>
</div>

<table class="items">
  {{ROWS}}
</table>

<div class="due"><span class="lbl">AMOUNT DUE</span><span class="val">{{CUR}} {{DUE_AMOUNT}}</span></div>

<div class="pay">
  <h2>MAKE PAYMENT TO</h2>
  <table>{{PAY_ROWS}}</table>
  <p>{{PAY_NOTE}}</p>
</div>

</body>
</html>
